[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raggy-evidence"
version = "0.1.0"
description = "Local-first PDF evidence search"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pymupdf>=1.26,<2",
  "numpy>=2.0,<3",
  "faiss-cpu>=1.11,<2",
  "huggingface-hub>=0.33,<1",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
ml = ["sentence-transformers>=5,<6", "transformers>=4.57,<5"]

[project.scripts]
raggy = "raggy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raggy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
